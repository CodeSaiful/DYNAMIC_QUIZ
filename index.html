<!doctype html>
<html lang="en" data-theme="white">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>QuizLab – Test Your Knowledge</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Theme colours are CSS variables: edit :root (White theme) and [data-theme=purple] (Purple theme). */
      * {
        box-sizing: border-box;
      }
      :root {
        --bg: #fff;
        --bi: none;
        --cd: #f5f5f8;
        --tx: #1b1b2f;
        --mu: #62627a;
        --bd: #e0e0ea;
        --ac: #6d28d9;
        --bt: #fff;
        --ok: #15803d;
        --no: #b91c1c;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      [data-theme="purple"] {
        --bg: #1a0b3b;
        --bi: linear-gradient(160deg, #2b1062, #150833);
        --cd: #2a1658;
        --tx: #f4eeff;
        --mu: #bdaee6;
        --bd: #473088;
        --ac: #b79cff;
        --bt: #1a0b3b;
        --ok: #4ade80;
        --no: #fca5a5;
      }
      [hidden] {
        display: none !important;
      }
      #bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.7s ease;
      }
      #bg.on {
        opacity: 1;
      }
      .w {
        position: relative;
        z-index: 1;
      }
      #fx {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 5;
        pointer-events: none;
      }
      @keyframes up {
        from {
          opacity: 0;
          transform: translateY(22px) scale(0.98);
        }
      }
      @keyframes shine {
        to {
          background-position: 200% 0;
        }
      }
      @keyframes glow {
        0% {
          box-shadow: 0 0 0 0 color-mix(in srgb, var(--ac) 50%, transparent);
        }
        100% {
          box-shadow: 0 0 0 18px transparent;
        }
      }
      @keyframes pop {
        0% {
          transform: scale(0.97);
        }
        55% {
          transform: scale(1.025);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes shake {
        20%,
        60% {
          transform: translateX(-7px);
        }
        40%,
        80% {
          transform: translateX(7px);
        }
      }
      @keyframes bob {
        50% {
          transform: translateY(-5px) rotate(-8deg);
        }
      }
      @keyframes beat {
        50% {
          transform: scale(1.14);
        }
      }
      #app.fx > * {
        animation: up 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) backwards;
      }
      #app.fx > :nth-child(2) {
        animation-delay: 0.07s;
      }
      #app.fx > :nth-child(3) {
        animation-delay: 0.14s;
      }
      #app.fx > :nth-child(4) {
        animation-delay: 0.2s;
      }
      #app.fx > :nth-child(n + 5) {
        animation-delay: 0.26s;
      }
      #app.fx .tp {
        animation: up 0.55s cubic-bezier(0.2, 0.7, 0.2, 1) backwards;
        animation-delay: calc(0.25s + var(--i, 0) * 45ms);
      }
      #app.fx .opt {
        animation: up 0.45s cubic-bezier(0.2, 0.7, 0.2, 1) backwards;
        animation-delay: calc(0.15s + var(--i, 0) * 70ms);
      }
      #app section h1 {
        background: linear-gradient(90deg, var(--tx), var(--ac), var(--tx)) 0 0/200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        animation: shine 6s linear infinite;
      }
      .tp:hover {
        transform: translateY(-5px) scale(1.02);
        box-shadow: 0 12px 26px color-mix(in srgb, var(--ac) 28%, transparent);
      }
      .tp:hover span {
        animation: bob 0.9s ease-in-out;
      }
      .pri:active,
      .chip:active,
      .tp:active {
        transform: scale(0.97);
      }
      .big {
        animation: glow 2.6s ease-out infinite;
      }
      .opt.ok {
        animation: pop 0.45s ease;
      }
      .opt.no {
        animation: shake 0.45s ease;
      }
      .warn #tm {
        animation: beat 1s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        background: var(--bg);
        background-image: var(--bi);
        background-attachment: fixed;
        color: var(--tx);
        min-height: 100vh;
        transition:
          background 0.3s,
          color 0.3s;
      }
      .w {
        max-width: 900px;
        margin: auto;
        padding: 16px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0 16px;
      }
      .logo {
        font-weight: 800;
        font-size: 20px;
        color: var(--ac);
      }
      h1 {
        font-size: clamp(30px, 6vw, 46px);
        margin: 0.3em 0;
        letter-spacing: -0.02em;
      }
      h2,
      h3 {
        margin: 1.4em 0 0.6em;
      }
      .mu {
        color: var(--mu);
      }
      .ctr {
        text-align: center;
      }
      .card {
        background: var(--cd);
        border: 1px solid var(--bd);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 2px 10px rgba(80, 40, 160, 0.08);
        margin-bottom: 12px;
      }
      .g {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 12px;
      }
      button {
        font: inherit;
        cursor: pointer;
        color: var(--tx);
      }
      button:focus-visible {
        outline: 3px solid var(--ac);
        outline-offset: 2px;
      }
      .tp {
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: flex-start;
        padding: 14px;
        border: 1.5px solid var(--bd);
        border-radius: 14px;
        background: var(--cd);
        font-weight: 600;
        text-align: left;
        transition: 0.18s;
      }
      .tp span {
        font-size: 22px;
      }
      .tp:hover,
      .chip:hover {
        transform: translateY(-2px);
        border-color: var(--ac);
      }
      .on {
        border-color: var(--ac) !important;
        box-shadow: 0 0 0 2px var(--ac);
      }
      .chip {
        padding: 10px 18px;
        border: 1.5px solid var(--bd);
        border-radius: 99px;
        background: var(--cd);
        transition: 0.18s;
      }
      .pri {
        background: var(--ac);
        color: var(--bt);
        border: 0;
        border-radius: 12px;
        padding: 12px 22px;
        font-weight: 700;
        transition: 0.18s;
      }
      .pri:hover {
        filter: brightness(1.1);
        transform: translateY(-1px);
      }
      .big {
        padding: 16px 36px;
        font-size: 18px;
        margin-top: 8px;
      }
      .ghost {
        background: transparent;
        border: 1.5px solid var(--bd);
        border-radius: 12px;
        padding: 11px 18px;
      }
      .ghost:hover:not(:disabled) {
        border-color: var(--ac);
      }
      .ghost:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .err {
        color: var(--no);
        font-weight: 600;
        min-height: 1.3em;
      }
      .big2 {
        font-size: 32px;
      }
      .lr {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1px solid var(--bd);
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 12px;
      }
      .top > div:first-child {
        flex: 1;
      }
      .bar {
        height: 10px;
        background: var(--bd);
        border-radius: 9px;
        margin-top: 8px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--ac);
        border-radius: 9px;
        transition: width 0.4s;
      }
      .opt {
        display: block;
        width: 100%;
        text-align: left;
        margin: 8px 0;
        padding: 14px 16px;
        border: 1.5px solid var(--bd);
        border-radius: 12px;
        background: transparent;
        transition: 0.15s;
      }
      .opt:hover:not(:disabled) {
        border-color: var(--ac);
        transform: translateX(3px);
      }
      .opt:disabled {
        cursor: default;
        opacity: 0.55;
      }
      .opt.x {
        text-decoration: line-through;
      }
      .opt.ok {
        border-color: var(--ok);
        background: color-mix(in srgb, var(--ok) 16%, transparent);
        opacity: 1;
      }
      .opt.no {
        border-color: var(--no);
        background: color-mix(in srgb, var(--no) 16%, transparent);
        opacity: 1;
      }
      .ex {
        padding: 12px 14px;
        border-radius: 10px;
        background: var(--bg);
        border: 1px solid var(--bd);
      }
      .okt {
        border-left: 4px solid var(--ok);
      }
      .not {
        border-left: 4px solid var(--no);
      }
      .tw {
        position: relative;
        width: 110px;
        height: 110px;
        flex: none;
      }
      .tw svg {
        width: 100%;
        height: 100%;
      }
      #tm {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 22px;
      }
      .tr {
        fill: none;
        stroke: var(--bd);
        stroke-width: 9;
      }
      .rg {
        fill: none;
        stroke: var(--ac);
        stroke-width: 9;
        stroke-linecap: round;
        transition: stroke-dashoffset 0.25s linear;
      }
      .warn .rg {
        stroke: var(--no);
      }
      .warn #tm {
        color: var(--no);
      }
      .gg {
        position: relative;
        width: min(220px, 70vw);
        aspect-ratio: 1;
        margin: 16px auto;
      }
      .gg svg {
        width: 100%;
        height: 100%;
      }
      .gn {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .gn b {
        font-size: 48px;
      }
      .gn span {
        color: var(--mu);
        font-weight: 600;
      }
      .st {
        background: var(--bg);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 12px;
      }
      .st b {
        display: block;
        font-size: 20px;
      }
      .okb {
        border-left: 5px solid var(--ok);
      }
      .nob {
        border-left: 5px solid var(--no);
      }
      .ub {
        border-left: 5px solid var(--mu);
      }
      .card p {
        margin: 0.4em 0;
      }
      .nav {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
        gap: 8px;
        margin-top: 12px;
      }
      .nb {
        padding: 10px 0;
        border: 1.5px solid var(--bd);
        border-radius: 10px;
        background: transparent;
        font-weight: 600;
        transition: 0.15s;
      }
      .nb:hover {
        border-color: var(--ac);
        transform: translateY(-1px);
      }
      .nb.dn {
        background: color-mix(in srgb, var(--ac) 22%, transparent);
        border-color: var(--ac);
      }
      .nb.cu {
        background: var(--ac);
        color: var(--bt);
        border-color: var(--ac);
      }
      @media (max-width: 520px) {
        .tw {
          width: 84px;
          height: 84px;
        }
        #tm {
          font-size: 17px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="bg" aria-hidden="true"></canvas><canvas id="fx" aria-hidden="true"></canvas>
    <div class="w">
      <header>
        <span class="logo">🧠 QuizLab</span
        ><button class="ghost" data-a="theme" aria-label="Toggle theme">◐ Theme</button>
      </header>
      <main id="app"></main>
    </div>
    <script>
      // ═══════════ HELPERS: localStorage, DOM shortcuts, HTML escaping ═══════════
      const ld = (k, d) => {
        try {
          const v = JSON.parse(localStorage.getItem(k));
          return v ?? d;
        } catch (e) {
          return d;
        }
      };
      const sv = (k, v) => {
        try {
          localStorage.setItem(k, JSON.stringify(v));
        } catch (e) {}
      };
      const rm = (k) => {
        try {
          localStorage.removeItem(k);
        } catch (e) {}
      };
      const $ = (s) => document.querySelector(s),
        app = $("#app");
      const esc = (s) =>
        String(s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      document.documentElement.dataset.theme = ld("theme", "white");
      // ═══════════ TOPICS AND DIFFICULTY LEVELS ═══════════
      const T = [
        ["py", "Python", "🐍"],
        ["cpp", "C++", "⚙️"],
        ["c", "C Programming", "🔧"],
        ["org", "Computer Systems & Organization", "🖥️"],
        ["html", "HTML", "🌐"],
        ["css", "CSS", "🎨"],
        ["js", "JavaScript", "✨"],
        ["dsa", "Data Structures & Algorithms", "🌳"],
        ["db", "Database Management (DBMS)", "🗄️"],
        ["os", "Operating Systems", "🧩"],
        ["net", "Computer Networks", "📡"],
        ["se", "Software Engineering", "📐"],
        ["cs", "General Computer Science", "💡"],
        ["mix", "Mixed Topics", "🎲"],
      ];
      const N = Object.fromEntries(T.map((t) => [t[0], t[1]]));
      const D = {
        e: ["Easy", "Basic concepts and fundamentals."],
        m: ["Medium", "Intermediate concepts and practical understanding."],
        h: ["Hard", "Advanced concepts, code analysis, and problem-solving."],
      };
      // ═══════════ QUESTION BANK (hand-written questions) ═══════════
      // [question, correct, wrong1, wrong2, wrong3, explanation] — per topic: [easy, medium, hard]
      // prettier-ignore
      const B = {
        // Python
        py: [
          [
            // Easy
            ["Which keyword defines a function in Python?", "def", "func", "function", "define", "def starts a function definition."],
            ["What does len([4,5,6]) return?", "3", "2", "4", "6", "len counts the items."],
          ],
          [
            // Medium
            ["What is [1,2,3][-1]?", "3", "1", "Error", "2", "Negative indexes count from the end."],
            ["Which type is immutable?", "tuple", "list", "dict", "set", "Tuples cannot change after creation."],
          ],
          [
            // Hard
            ["a=[1]; b=a; b.append(2); print(a) outputs?", "[1, 2]", "[1]", "[2]", "Error", "b and a reference the same list object."],
            ["def f(x=[]): x.append(1); return x — what does the 2nd call f() return?", "[1, 1]", "[1]", "[]", "Error", "The default list is created once and reused."],
          ],
        ],
        // C++
        cpp: [
          [
            // Easy
            ["Which operator accesses a member through a pointer?", "->", ".", "::", "&", "-> dereferences and accesses a member."],
            ["Which header provides cout?", "<iostream>", "<stdio.h>", "<string>", "<cmath>", "iostream declares cin and cout."],
          ],
          [
            // Medium
            ["A reference (int&) must be...", "Initialized when declared", "Null", "Allocated with new", "Const", "References bind to an object at creation."],
            ["Which keyword enables runtime polymorphism?", "virtual", "static", "inline", "friend", "virtual enables dynamic dispatch."],
          ],
          [
            // Hard
            ["Memory from new[] must be freed with?", "delete[]", "delete", "free", "remove", "Array allocations pair with delete[]."],
            ["Size of an empty class on most compilers?", "1 byte", "0 bytes", "4 bytes", "8 bytes", "Distinct objects need distinct addresses."],
          ],
        ],
        // C Programming
        c: [
          [
            // Easy
            ["Which format specifier prints an int?", "%d", "%f", "%c", "%s", "%d is for decimal integers."],
            ["Which character ends a C string?", "'\\0'", "'\\n'", "' '", "EOF", "Strings are null-terminated."],
          ],
          [
            // Medium
            ["sizeof(char) always equals?", "1", "2", "4", "8", "The standard defines it as 1."],
            ["arr[i] is equivalent to?", "*(arr + i)", "&arr + i", "*arr + i", "arr * i", "Indexing is pointer arithmetic."],
          ],
          [
            // Hard
            ["int a=5; int *p=&a; *p=9; a is now?", "9", "5", "Address of a", "Undefined", "Writing through p changes a."],
            ["malloc returns what on failure?", "NULL", "-1", "A zeroed block", "Garbage pointer", "malloc returns NULL when it fails."],
          ],
        ],
        // Computer Systems & Organization
        org: [
          [
            // Easy
            ["Which CPU part does arithmetic?", "ALU", "Cache", "Bus", "Register file", "The ALU does arithmetic and logic."],
            ["How many bits are in a byte?", "8", "4", "16", "10", "A byte is 8 bits."],
          ],
          [
            // Medium
            ["Which memory is fastest?", "Registers", "RAM", "SSD", "HDD", "Registers sit inside the CPU."],
            ["The program counter holds?", "Address of the next instruction", "Last result", "Stack size", "Cache hits", "PC points to the next instruction."],
          ],
          [
            // Hard
            ["A pipeline stall waiting for an earlier result is a?", "Data hazard", "Structural hazard", "Control hazard", "Cache hazard", "That is a data (RAW) hazard."],
            ["8-bit two's complement of 5 negated (-5)?", "11111011", "11111010", "10000101", "00000101", "Invert 00000101 and add 1."],
          ],
        ],
        // HTML
        html: [
          [
            // Easy
            ["Which tag creates a hyperlink?", "<a>", "<link>", "<href>", "<url>", "<a href> makes links."],
            ["Largest heading tag?", "<h1>", "<h6>", "<head>", "<title>", "h1 is the top-level heading."],
          ],
          [
            // Medium
            ["Which attribute gives image alt text?", "alt", "title", "src", "caption", "alt describes images for accessibility."],
            ["Semantic element for navigation links?", "<nav>", "<div>", "<span>", "<section>", "nav marks navigation."],
          ],
          [
            // Hard
            ["Which script attribute runs after parsing without blocking?", "defer", "block", "sync", "lazy", "defer waits until HTML is parsed."],
            ["Which input type shows a date picker?", "date", "calendar", "day", "datetime-text", "type=date renders a date control."],
          ],
        ],
        // CSS
        css: [
          [
            // Easy
            ["Which property sets text color?", "color", "font-color", "text-style", "fill", "color sets text color."],
            ["Unit relative to the root font size?", "rem", "px", "pt", "cm", "rem uses the root element size."],
          ],
          [
            // Medium
            ["Which display value makes a flex container?", "flex", "block-flex", "inline", "table-cell", "display:flex enables flexbox."],
            ["Which property controls stacking order?", "z-index", "layer", "stack", "order-z", "z-index sets stacking."],
          ],
          [
            // Hard
            ["Highest specificity?", "#id", ".class", "element", "*", "IDs outrank classes and elements."],
            ["With border-box, width includes?", "Padding and border", "Content only", "Margin", "Outline", "border-box counts padding and border."],
          ],
        ],
        // JavaScript
        js: [
          [
            // Easy
            ["Which keyword declares a block-scoped variable?", "let", "var", "define", "dim", "let is block-scoped."],
            ["typeof null returns?", "object", "null", "undefined", "number", "A long-standing language quirk."],
          ],
          [
            // Medium
            ["What is [] + [] ?", "Empty string", "0", "[]", "undefined", "Arrays become empty strings and concatenate."],
            ["=== checks?", "Value and type", "Value only", "Type only", "Reference only", "Strict equality avoids coercion."],
          ],
          [
            // Hard
            ["0.1 + 0.2 === 0.3 evaluates to?", "false", "true", "NaN", "Error", "The sum is 0.30000000000000004."],
            ["Which runs first: setTimeout(f,0) or Promise.then?", "Promise.then", "setTimeout", "Same time", "Depends on f", "Microtasks run before timer callbacks."],
          ],
        ],
        // Data Structures & Algorithms
        dsa: [
          [
            // Easy
            ["Which structure is LIFO?", "Stack", "Queue", "Heap", "Array", "Last in, first out."],
            ["Array access by index costs?", "O(1)", "O(n)", "O(log n)", "O(n²)", "Indexing is constant time."],
          ],
          [
            // Medium
            ["Binary search requires data to be?", "Sorted", "Unique", "Linked", "Hashed", "It halves a sorted range each step."],
            ["Which traversal uses a queue?", "BFS", "DFS", "Inorder", "Preorder", "BFS explores level by level."],
          ],
          [
            // Hard
            ["Average time of quicksort?", "O(n log n)", "O(n)", "O(n²)", "O(log n)", "Balanced partitions give n log n."],
            ["Shortest paths with non-negative weights?", "Dijkstra", "Kruskal", "Prim", "Topological sort", "Dijkstra needs non-negative weights."],
          ],
        ],
        // DBMS
        db: [
          [
            // Easy
            ["Which SQL command retrieves data?", "SELECT", "INSERT", "UPDATE", "DROP", "SELECT queries rows."],
            ["What uniquely identifies a row?", "Primary key", "Foreign key", "View", "Trigger", "A primary key is unique per row."],
          ],
          [
            // Medium
            ["Which join keeps only matching rows?", "INNER JOIN", "LEFT JOIN", "FULL JOIN", "CROSS JOIN", "INNER JOIN keeps matches only."],
            ["'A' in ACID stands for?", "Atomicity", "Availability", "Accuracy", "Authority", "Transactions are all-or-nothing."],
          ],
          [
            // Hard
            ["Which normal form removes partial dependencies?", "2NF", "1NF", "3NF only", "4NF", "2NF removes partial dependence on a composite key."],
            ["Reading uncommitted data is called?", "Dirty read", "Phantom read", "Lost index", "Deadlock", "A dirty read sees uncommitted changes."],
          ],
        ],
        // Operating Systems
        os: [
          [
            // Easy
            ["What manages hardware and software resources?", "Operating system", "Compiler", "Browser", "Editor", "The OS manages resources."],
            ["A running program is a?", "Process", "File", "Driver", "Macro", "A process is a program in execution."],
          ],
          [
            // Medium
            ["Which scheduling is non-preemptive?", "FCFS", "Round Robin", "SRTF", "Multilevel feedback", "FCFS runs each job to completion."],
            ["Virtual memory extends RAM using?", "Paging to disk", "CPU cache", "Registers", "BIOS", "Pages swap between RAM and disk."],
          ],
          [

          vr: (Math.random() - 0.5) * 14,
          c: cols[(Math.random() * 6) | 0],
          life: 3 + Math.random() * 1.5,
        }));
        let last = performance.now();
        (function f(t) {
          const dt = Math.min(0.04, (t - last) / 1000);
          last = t;
          fx.clearRect(0, 0, W, H);
          let alive = 0;
          for (const p of P) {
            p.life -= dt;
            if (p.life <= 0) continue;
            alive++;
            p.vy += 900 * dt;
            p.vx *= 1 - 0.8 * dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.r += p.vr * dt;
            fx.save();
            fx.globalAlpha = Math.min(1, p.life);
            fx.translate(p.x, p.y);
            fx.rotate(p.r);
            fx.scale(1, Math.cos(p.r * 2));
            fx.fillStyle = p.c;
            fx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            fx.restore();
          }
          if (alive) fxId = requestAnimationFrame(f);
          else fx.clearRect(0, 0, W, H);
        })(last);
      }
      function bgAnim(on) {
        if (on === bgRun) return;
        bgRun = on;
        bgc.classList.toggle("on", on);
        cancelAnimationFrame(bgId);
        if (on) {
          if (!bgP.length) {
            bgSize();
            const n = Math.min(55, Math.max(16, ((bgW * bgH) / 28000) | 0));
            bgP = Array.from({ length: n }, () => ({
              x: Math.random() * bgW,
              y: Math.random() * bgH,
              v: 7 + Math.random() * 16,
              a: 8 + Math.random() * 26,
              s: 0.25 + Math.random() * 0.5,
              p: Math.random() * 6.28,
              z: 12 + ((Math.random() * 14) | 0),
              o: 0.08 + Math.random() * 0.11,
              t: TOK[(Math.random() * TOK.length) | 0],
            }));
          }
          bgLast = performance.now();
          bgId = requestAnimationFrame(bgLoop);
        } else
          setTimeout(() => {
            if (!bgRun) bx.clearRect(0, 0, bgW, bgH);
          }, 700);
      }
      addEventListener("resize", () => {
        if (bgP.length) bgSize();
      });
      // ═══════════ HOME SCREEN (topics, settings, dashboard) ═══════════
      function home(s) {
        stop();
        bgAnim(true);
        app.className = s ? "" : "fx";
        const y = scrollY,
          pl = cands(cfg.t, cfg.d).filter((z) => z.w === 0).length,
          best = hist.length ? Math.max(...hist.map((h) => h.p)) : null,
          tp = {};
        hist.forEach((h) => (tp[h.t] = tp[h.t] || []).push(h.p));
        app.innerHTML = `<section><h1 style="animation-delay:-${((performance.now() / 1000) % 6).toFixed(2)}s">Test Your Knowledge.</h1>
<p class="mu">Choose your topic, set your difficulty, and challenge yourself.</p></section>
 <h3>Topic</h3>
<div class="g">${T.map((t, i) => `<button style="--i:${i}" class="tp ${cfg.t === t[0] ? "on" : ""}" data-a="topic" data-v="${t[0]}"><span>${t[2]}</span>${t[1]}</button>`).join("")}</div>
 <h3>Number of questions</h3>
<div class="row">${[10, 15, 30].map((n) => `<button class="chip ${cfg.n === n ? "on" : ""}" data-a="n" data-v="${n}">${n} Questions · ${n * 2} min</button>`).join("")}</div>
 <h3>Difficulty</h3>
<div class="row">${Object.keys(D)
          .map(
            (k) =>
              `<button class="chip ${cfg.d === k ? "on" : ""}" data-a="d" data-v="${k}">${D[k][0]}</button>`,
          )
          .join("")}</div>
<p class="mu">${D[cfg.d][1]}</p>
 ${cfg.t && cfg.t !== "mix" && pl < cfg.n ? `<p class="mu">Your quiz will have exactly ${cfg.n} questions. ${D[cfg.d][0]} questions come first; nearby difficulty levels fill the rest.</p>` : ""}
 <p id="er" class="err"></p>
<button class="pri big" data-a="start">Start Quiz →</button>
 <h2>Your Dashboard</h2>
<div class="g"><div class="card"><div class="mu">Quizzes completed</div><b class="big2">${hist.length}</b></div>
<div class="card"><div class="mu">Best score</div><b class="big2">${best === null ? "—" : best + "%"}</b></div></div>
 ${
   hist.length
     ? `<div class="card"><b>Topic performance</b>${Object.entries(tp)
         .map(
           ([k, v]) =>
             `<div class="lr"><span>${N[k]}</span><span>${Math.round(v.reduce((a, b) => a + b) / v.length)}% avg · ${v.length} quiz${v.length > 1 ? "zes" : ""}</span></div>`,
         )
         .join("")}</div>
 <div class="card"><b>Recent attempts</b>${hist
   .slice(0, 5)
   .map(
     (h) =>
       `<div class="lr"><span>${N[h.t]} · ${D[h.d][0]}</span><span>${h.c}/${h.n} (${h.p}%) · ${new Date(h.at).toLocaleDateString()}</span></div>`,
   )
   .join(
     "",
   )}<div class="row"><button class="ghost" data-a="reset">Reset history</button></div></div>`
     : '<p class="mu">Complete a quiz to see your stats here.</p>'
 }`;
        scrollTo(0, y);
      }
      // ═══════════ QUIZ SCREEN (start, countdown, question view, navigation) ═══════════
      function start(c) {
        const qs = build(c);
        if (qs.length !== c.n) {
          $("#er") && ($("#er").textContent = "No questions available for this selection.");
          return;
        }
        res = null;
        Q = {
          qs,
          i: 0,
          ans: qs.map(() => -1),
          h: qs.map(() => -1),
          c,
          t0: Date.now(),
          end: Date.now() + qs.length * SPQ,
        };
        persist();
        show();
        if (Q) {
          tm = setInterval(upd, 250);
        }
        scrollTo(0, 0);
      }
      function upd() {
        if (!Q) return;
        const l = Math.max(0, Q.end - Date.now()),
          tot = Q.qs.length * SPQ,
          s = Math.ceil(l / 1000),
          t = $("#tm");
        if (t) {
          t.textContent = `${(s / 60) | 0}:${String(s % 60).padStart(2, "0")}`;
          $("#ring").style.strokeDashoffset = 326.7 * (1 - l / tot);
          $("#tw").classList.toggle("warn", l < tot * 0.2 || l < 15000);
        }
        if (l <= 0) finish();
      }
      function show() {
        bgAnim(false);
        app.className = Q.sh === Q.i ? "" : "fx";
        Q.sh = Q.i;
        const q = Q.qs[Q.i],
          a = Q.ans[Q.i],
          lock = a >= 0,
          n = Q.qs.length,
          hd = Q.h[Q.i];
        app.innerHTML = `<div class="row" style="margin:0 0 10px"><button class="ghost" data-a="exit" aria-label="Exit quiz and go to home page">← Exit Quiz</button></div>
<div class="top"><div><b>Question ${Q.i + 1} of ${n}</b> <span class="mu">· ${N[Q.c.t]} · ${D[Q.c.d][0]}</span><div class="bar"><i style="width:${(Q.ans.filter((x) => x >= 0).length / n) * 100}%"></i></div></div>
 <div id="tw" class="tw"><svg viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="52"/><circle id="ring" class="rg" cx="60" cy="60" r="52" stroke-dasharray="326.7" transform="rotate(-90 60 60)"/></svg><span id="tm"></span></div></div>
 <div class="card"><h2 style="margin-top:0">${esc(q.q)}</h2>${q.o.map((o, j) => `<button style="--i:${j}" class="opt ${lock && j === q.a ? "ok" : ""} ${lock && j === a && a !== q.a ? "no" : ""} ${hd === j ? "x" : ""}" data-a="pick" data-v="${j}" ${lock || hd === j ? "disabled" : ""}>${"ABCD"[j]}. ${esc(o)}</button>`).join("")}
 ${lock ? `<p class="ex ${a === q.a ? "okt" : "not"}">${a === q.a ? "✔ Correct. " : "✘ Incorrect — the answer is " + esc(q.o[q.a]) + ". "}${esc(q.e)}</p>` : ""}
 <div class="row"><button class="ghost" data-a="hint" ${lock || hd >= 0 ? "disabled" : ""}>💡 Hint: remove a wrong option</button><button class="pri" data-a="next">${Q.i + 1 === n ? "Finish Quiz" : "Next Question"}</button></div></div>
 <div class="card"><b>Jump to question</b> <span class="mu">(filled = answered)</span><div class="nav">${Q.qs.map((_, j) => `<button class="nb ${j === Q.i ? "cu" : Q.ans[j] >= 0 ? "dn" : ""}" data-a="goto" data-v="${j}" aria-label="Go to question ${j + 1}" ${j === Q.i ? 'aria-current="true"' : ""}>${j + 1}</button>`).join("")}</div></div>`;
        upd();
      }
      // ═══════════ FINISHING A QUIZ AND RESULTS SCREEN ═══════════
      const lab = (p) =>
        p >= 90
          ? ["Excellent", "Outstanding work!"]
          : p >= 75
            ? ["Great Job", "You really know your stuff."]
            : p >= 50
              ? ["Good Effort", "Solid progress — keep going."]
              : p >= 30
                ? ["Keep Practicing", "Review the answers below and try again."]
                : ["Try Again", "Every attempt builds knowledge."];
      function finish() {
        if (!Q) return;
        stop();
        const n = Q.qs.length,
          c = Q.qs.filter((q, i) => Q.ans[i] === q.a).length,
          u = Q.ans.filter((a) => a < 0).length,
          used = Math.min(Date.now(), Q.end) - Q.t0;
        res = {
          c,
          w: n - c - u,
          u,
          n,
          p: Math.round((c / n) * 100),
          pts: c * 10,
          used,
          tot: n * SPQ,
          cfg: Q.c,
          qs: Q.qs,
          ans: Q.ans,
        };
        rm("active");
        hist.unshift({ t: Q.c.t, d: Q.c.d, p: res.p, c, n, at: Date.now() });
        hist = hist.slice(0, 50);
        sv("hist", hist);
        Q = null;
        results();
        scrollTo(0, 0);
      }
      function results() {
        bgAnim(false);
        app.className = "fx";
        const r = res,
          [l, m] = lab(r.p),
          f = (s) => `${(s / 60) | 0}m ${String(s % 60).padStart(2, "0")}s`,
          sec = Math.round(r.used / 1000);
        app.innerHTML = `<div class="card ctr"><h1>${m}</h1>
<div class="gg"><svg viewBox="0 0 200 200"><circle class="tr" style="stroke-width:14" cx="100" cy="100" r="80"/><circle id="gc" class="rg" style="stroke-width:14;transition:stroke-dashoffset 1.4s ease-out" cx="100" cy="100" r="80" stroke-dasharray="502.65" stroke-dashoffset="502.65" transform="rotate(-90 100 100)"/></svg><div class="gn"><b id="pc">0%</b><span>${l}</span></div></div>
 <p><b>${r.pts} points</b> · ${r.c} of ${r.n} correct (${r.p}%)</p>
 <div class="g" style="text-align:left">${[
   ["Correct", r.c],
   ["Incorrect", r.w],
   ["Unanswered", r.u],
   ["Time taken", f(sec)],
   ["Avg per question", f(Math.round(sec / r.n))],
   ["Time remaining", f(Math.max(0, Math.round(r.tot / 1000) - sec))],
   ["Topic", N[r.cfg.t]],
   ["Difficulty", D[r.cfg.d][0]],
 ]
   .map((x) => `<div class="st"><span class="mu">${x[0]}</span><b>${x[1]}</b></div>`)
   .join("")}</div>
 <div class="row" style="justify-content:center"><button class="pri" data-a="retry">Retry Quiz</button><button class="ghost" data-a="home">🏠 Home</button><button class="ghost" data-a="newq">New Quiz</button><button class="ghost" data-a="rev">Review Answers</button><button class="ghost" data-a="theme">Change Theme</button></div></div>
 <div id="rv" hidden><h2>Answer review</h2>${r.qs
   .map((q, i) => {
     const a = r.ans[i];
     return `<div class="card ${a < 0 ? "ub" : a === q.a ? "okb" : "nob"}"><b>${i + 1}. ${esc(q.q)}</b><p>Your answer: ${a < 0 ? "Not answered" : esc(q.o[a])}</p>
<p>Correct answer: ${esc(q.o[q.a])}</p>
<p class="mu">${esc(q.e)}</p></div>`;
   })
   .join("")}</div>`;
        if (r.p >= 50) setTimeout(confetti, 400);
        requestAnimationFrame(() =>
          requestAnimationFrame(() => {
            const g = $("#gc");
            if (g) g.style.strokeDashoffset = 502.65 * (1 - r.p / 100);
          }),
        );
        const t0 = performance.now();
        (function f2(t) {
          const k = Math.min(1, (t - t0) / 1400),
            e = $("#pc");
          if (!e) return;
          e.textContent = Math.round(r.p * (1 - Math.pow(1 - k, 3))) + "%";
          if (k < 1) requestAnimationFrame(f2);
        })(t0);
      }
      // ═══════════ BUTTON ACTIONS (each button has data-a="name" that maps to a function here) ═══════════
      const A = {
        topic: (v) => {
          cfg.t = v;
          home(1);
        },
        n: (v) => {
          cfg.n = +v;
          home(1);
        },
        d: (v) => {
          cfg.d = v;
          home(1);
        },
        start: () => {
          if (!cfg.t) {
            $("#er").textContent = "Please select a topic to begin.";
            return;
          }
          start({ ...cfg });
        },
        pick: (v) => {
          if (!Q || Q.ans[Q.i] >= 0 || Q.h[Q.i] === +v) return;
          Q.ans[Q.i] = +v;
          persist();
          show();
        },
        hint: () => {
          const q = Q.qs[Q.i];
          if (Q.ans[Q.i] >= 0 || Q.h[Q.i] >= 0) return;
          const w = [0, 1, 2, 3].filter((j) => j !== q.a);
          Q.h[Q.i] = w[(Math.random() * 3) | 0];
          persist();
          show();
        },
        next: () => {
          if (Q.i + 1 >= Q.qs.length) return finish();
          Q.i++;
          persist();
          show();
        },
        retry: () => start({ ...res.cfg }),
        newq: () => {
          res = null;
          home();
          scrollTo(0, 0);
        },
        home: () => {
          res = null;
          cfg = { t: null, n: 10, d: "e" };
          home();
          scrollTo(0, 0);
        },
        exit: () => {
          stop();
          Q = null;
          res = null;
          rm("active");
          home();
          scrollTo(0, 0);
        },
        goto: (v) => {
          if (!Q || v < 0 || v >= Q.qs.length) return;
          Q.i = +v;
          persist();
          show();
          scrollTo(0, 0);
        },
        rev: () => {
          const e = $("#rv");
          e.hidden = !e.hidden;
          if (!e.hidden) e.scrollIntoView({ behavior: "smooth" });
        },
        reset: () => {
          if (confirm("Clear all saved quiz history?")) {
            hist = [];
            sv("hist", hist);
            home();
          }
        },
        theme: () => {
          const t = document.documentElement.dataset.theme === "white" ? "purple" : "white";
          document.documentElement.dataset.theme = t;
          sv("theme", t);
        },
      };
      document.body.addEventListener("click", (e) => {
        const b = e.target.closest("[data-a]");
        if (b && !b.disabled) A[b.dataset.a](b.dataset.v);
      });
      // ═══════════ STARTUP: resume an unfinished quiz or show the home page ═══════════
      const ac = ld("active", null);
      if (ac && ac.qs && ac.qs.length) {
        Q = ac;
        show();
        if (Q) tm = setInterval(upd, 250);
      } else home();
    </script>
  </body>
</html>
